version: '3.8'

services:
  jobmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    image: ice-stream-flink:latest
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    env_file:
      - .env
    volumes:
      - ./secrets:/opt/flink/usrlib/secrets:ro # Mount CA cert

  taskmanager:
    image: ice-stream-flink:latest
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    env_file:
      - .env
    volumes:
      - ./secrets:/opt/flink/usrlib/secrets:ro
